name: Publish to npm

# Fires on the version tag only, not on the GitHub release that usually follows
# it. npm refuses to republish a version that already exists, so a second
# trigger would only ever produce a red run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # The tag workflow is the last gate before the package is public, and CI
      # only covers main, so run the suite here too rather than trusting it.
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
